<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OutcomeAtlas Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 40px 20px;
        }

        .signup-box {
            background: white;
            max-width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #0002;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="signup-box">
    <h1>OutcomeAtlas</h1>
    <h2>Create Account</h2>

    <form id="signupForm">
    <input type="text" id="fullName"
           placeholder="Full Name" required>

    <input type="email" id="email"
           placeholder="Email Address" required>

    <input type="password" id="password"
           placeholder="Password" required minlength="8">

    <button type="submit">Sign Up</button>
</form>

<p id="signupMessage"></p>

    <p>Already registered? <a href="login.html">Login</a></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDII9RLwoEjecQcLY2u6tHRNwTPWTCieqE",
    authDomain: "outcomeatlas.firebaseapp.com",
    projectId: "outcomeatlas",
    storageBucket: "outcomeatlas.firebasestorage.app",
    messagingSenderId: "678341239640",
    appId: "1:678341239640:web:f77a59ffd07b29045cbb2d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const result = await createUserWithEmailAndPassword(auth, email, password);

        await updateProfile(result.user, {
            displayName: name
        });

        alert("Account created successfully!");
        window.location.href = "login.html";

    } catch (error) {
        alert(error.message);
    }
});
</script>
</body>
</html>
